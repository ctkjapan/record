<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d0c" />
  <title>GROOVE / spin your record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="top-bar">
      <a class="wordmark" href="./">GROOVE<span>.</span></a>
      <p class="session-label">SIDE A <span>/</span> 001</p>
      <div class="top-bar-actions">
        <button class="change-button" id="changeButton" type="button">変更</button>
        <button class="icon-button" id="resetButton" type="button" aria-label="レコードを最初の位置に戻す" title="リセット">↺</button>
      </div>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <!--
      <div class="intro">
        <p class="eyebrow">AN ANALOG INTERFACE</p>
        <h1 id="pageTitle">針を落として、<br /><em>音を回す。</em></h1>
        <p class="description">円盤をスワイプして、指先でグルーヴを探そう。</p>
      </div>
      -->
      <div class="now-playing" aria-live="polite">
        <span class="status-dot"></span>
        <span id="playState">READY TO SPIN</span>
      </div>
    </section>

    <section class="player" aria-label="レコードプレーヤー">
      <div class="player-stage">
        <div class="record-shadow" aria-hidden="true"></div>
        <div class="record" id="record" role="slider" tabindex="0" aria-label="レコードを回す" aria-valuemin="0"
          aria-valuemax="360" aria-valuenow="0">
          <div class="grooves grooves-one"></div>
          <div class="grooves grooves-two"></div>
          <div class="label">
            <span class="label-small">GROOVE</span>
            <strong>001</strong>
            <span class="label-small">STEREO</span>
          </div>
          <div class="spindle"></div>
        </div>
        <div class="needle-arm" aria-hidden="true">
          <div class="needle-pivot"></div>
          <div class="needle-stick"></div>
          <div class="needle-head"></div>
        </div>
        <div class="drag-hint" id="dragHint"><span>↻</span> SWIPE TO SPIN</div>
      </div>
      <div class="player-footer">
        <div class="speed-readout"><span>RPM</span><strong id="rpmValue">33⅓</strong></div>
        <div class="meter" aria-label="回転速度"><span id="meterFill"></span></div>
        <p class="angle-readout"><span>ROTATION</span><strong id="angleValue">000°</strong></p>
      </div>
    </section>

    <section class="picker-panel" id="pickerPanel" aria-label="レコードを変更" hidden>
      <div class="picker-heading">
        <div>
          <p class="eyebrow">SELECT A RECORD</p>
          <h2>次の一枚を選ぶ。</h2>
        </div>
        <button class="close-button" id="closePickerButton" type="button">戻る</button>
      </div>
      <div class="picker-window">
        <div class="picker-track" id="pickerTrack"></div>
      </div>
      <div class="picker-footer">
        <p><span id="pickerPosition">01</span> / 04</p>
        <p id="pickerStatus">中央のレコードをクリックして選択</p>
      </div>
    </section>

    <footer class="footer-note">
      <p>手の動きが、そのまま音の流れになる。</p>
      <span>© 2024 GROOVE LAB</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>

</html>
