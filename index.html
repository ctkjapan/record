<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d5b98f" />
  <title>GROOVE RECORDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css?260920_7" />
</head>

<body>
  <header class="top-bar">
    <a class="wordmark" href="./" aria-label="GROOVE RECORDS ホーム">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span>GROOVE<br />RECORDS</span>
    </a>
    <nav class="top-bar-actions">
      <button class="change-button" id="changeButton" type="button" aria-pressed="false">COLLECTION</button>
    </nav>
  </header>

  <main class="app-shell">
    <section id="PagePlayer">
      <section id="hero" class="hero" aria-labelledby="pageTitle">
        <div class="album-heading">
          <p class="album-index"><span id="albumNumber">01</span> / <span id="albumMaxNumber">99</span></p>
          <h1 id="pageTitle"><span id="albumArtist">Artist</span><em id="albumTitle">Title</em></h1>
        </div>
      </section>

      <section id="playerPanel" class="player" aria-label="レコードプレーヤー">
        <div id="playerStage" class="player-stage">
          <canvas class="visualizer" id="visualizer" aria-hidden="true"></canvas>
          <div class="record-shadow" aria-hidden="true"></div>
          <div class="record" id="record" role="slider" tabindex="0" aria-label="レコードを回す" aria-valuemin="0"
            aria-valuemax="360" aria-valuenow="0">
            <div class="grooves grooves-one"></div>
            <div class="grooves grooves-two"></div>
            <div class="label">
              <span class="label-small">GROOVE</span>
              <strong id="labelNumber">001</strong>
              <span class="label-small">STEREO</span>
            </div>
          </div>
        </div>
        <div class="player-footer">
          <div class="audio-progress">
            <input class="audio-seek" id="audioSeek" type="range" min="0" max="0" step="0.01" value="0"
              aria-label="音声の再生位置" disabled />
            <div class="audio-time-readout"><span>TIME</span><strong id="audioTime">00:00 / 00:00</strong></div>
          </div>
          <div class="speed-readout"><span>PLAYBACK</span><strong id="playbackRateValue">0.00x</strong></div>
          <div class="meter" aria-label="回転速度"><span id="meterFill"></span></div>
          <p class="angle-readout"><span>ROTATION</span><strong id="angleValue">000°</strong></p>
          <div class="now-playing" aria-live="polite">
            <span class="status-dot"></span>
            <span id="playState">READY TO SPIN</span>
          </div>
        </div>
      </section>
    </section>

    <section id="PagePicker">
      <section id="pickerPanel" class="picker-panel" aria-label="レコードを変更" hidden>
        <div class="picker-heading">
          <div>
            <h2>Choose<br />your record.</h2>
          </div>
          <button class="close-button" id="closePickerButton" type="button">BACK TO PLAYER</button>
        </div>
        <div class="picker-window">
          <div class="picker-track" id="pickerTrack"></div>
        </div>
        <div class="picker-footer">
          <span><span id="pickerPosition">01</span> / <span id="pickerPositionMax">99</span></p>
            <p id="pickerStatus">中央のレコードをクリックして選択</p>
            <p class="picker-instruction">DRAG TO BROWSE →</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/assets/js/main.js?260920_8"></script>
</body>

</html>
