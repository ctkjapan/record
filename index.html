<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#302d5d" />
  <title>VINYL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css?260922_1" />
  <link rel="shortcut icon" href="assets/ico/favicon.ico">
</head>

<body>
  <section class="splash-screen" id="splashScreen" role="dialog" aria-modal="true" aria-labelledby="splashTitle"
    aria-describedby="splashStatus">
    <div class="splash-content">
      <p class="splash-kicker">
        <span class="wordmark">
          <span class="wordmark-mark" aria-hidden="true"></span>
        </span>
      </p>
      <h1 id="splashTitle">Put the needle on.</h1>
      <button class="button splash-button" id="splashStartButton" type="button">TAP TO START</button>
      <p class="splash-status" id="splashStatus" aria-live="polite">Tap to enable audio.</p>
    </div>
  </section>

  <header class="top-bar">
    <button class="wordmark" id="menuButton" type="button" aria-label="メニューを開く" aria-controls="menuPanel"
      aria-expanded="false">
      <span class="wordmark-mark" aria-hidden="true"></span>
    </button>
    <nav class="top-bar-actions" id="menuPanel" aria-label="メニュー" hidden>
      <button class="button change-button close-menu" id="changeButton" type="button"
        aria-pressed="false">Choose<br />your vinyl.</button>
      <h2>playback speed</h2>
      <dic class="playback-speed-changer">
        <button class="button" id="playbackX1Button" type="button">1.0</button>
        <button class="button" id="PlaybackSpeedReduction" type="button">-0.1</button>
        <button class="button" id="PlaybackSpeedIncrement" type="button">+0.1</button>
        <button class="button" id="playbackReverse" type="button" aria-pressed="false">REVERSE</button>
      </dic>
      <h2>player option</h2>
      <dic class="player-option">
        <button class="button noise-button" id="noiseButton" type="button" aria-pressed="false">NOISE </button>
        <button class="button visualizer-button" id="visualizerButton" type="button" aria-pressed="true">VISUALIZER
        </button>
      </dic>
    </nav>
  </header>

  <main class="app-shell">
    <section id="PagePlayer">
      <section id="hero" class="hero" aria-labelledby="pageTitle">
        <div class="album-heading">
          <p class="album-index"><span id="albumNumber">01</span> / <span id="albumMaxNumber">99</span></p>
          <h1 id="pageTitle"><span id="albumArtist">Artist</span><em id="albumTitle">Title</em></h1>
        </div>
      </section>

      <section id="playerPanel" class="player" aria-label="レコードプレーヤー">
        <div id="playerStage" class="player-stage">
          <canvas class="visualizer" id="visualizer" aria-hidden="true"></canvas>
          <div class="record-shadow" aria-hidden="true"></div>
          <div class="record" id="record" role="slider" tabindex="0" aria-label="レコードを回す" aria-valuemin="0"
            aria-valuemax="360" aria-valuenow="0">
            <div class="grooves grooves-one"></div>
            <div class="grooves grooves-two"></div>
            <div class="label" id="label"></div>
          </div>
        </div>
        <div class="player-footer">
          <div class="audio-progress">
            <input class="audio-seek" id="audioSeek" type="range" min="0" max="0" step="0.01" value="0"
              aria-label="音声の再生位置" disabled />
            <div class="audio-time-readout"><span>TIME</span><strong id="audioTime">00:00 / 00:00</strong></div>
          </div>
          <div class="speed-readout"><span>PLAYBACK</span><strong id="playbackRateValue">0.00x</strong></div>
          <div class="meter" aria-label="回転速度"><span id="meterFill"></span></div>
          <p class="angle-readout"><span>ROTATION</span><strong id="angleValue">000°</strong></p>
          <div class="now-playing" aria-live="polite">
            <span class="status-dot"></span>
            <span id="playState">READY TO SPIN</span>
          </div>
        </div>
      </section>
    </section>

    <section id="PagePicker">
      <section id="pickerPanel" class="picker-panel" aria-label="レコードを変更" hidden>
        <div class="picker-heading">
          <div>
            <h2>Choose<br />your vinyl.</h2>
          </div>
        </div>
        <div class="picker-window">
          <div class="picker-track" id="pickerTrack"></div>
        </div>
        <div class="picker-footer">
          <span><span id="pickerPosition">01</span> / <span id="pickerPositionMax">99</span></p>
            <p id="pickerStatus">中央のレコードをクリックして選択</p>
            <p class="picker-instruction">DRAG TO BROWSE →</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="assets/js/main.js?260922_1"></script>
</body>

</html>
