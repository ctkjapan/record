<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d5b98f" />
  <title>GROOVE RECORDS — Interactive Vinyl Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?260919_2" />
</head>

<body>
  <main class="app-shell">
    <header class="top-bar">
      <a class="wordmark" href="./" aria-label="GROOVE RECORDS ホーム">
        <span class="wordmark-mark" aria-hidden="true"></span>
        <span>GROOVE<br />RECORDS</span>
      </a>
      <p class="shop-note">AN INTERACTIVE VINYL ARCHIVE<br />TOKYO, JAPAN</p>
      <div class="top-bar-actions">
        <button class="change-button" id="changeButton" type="button" aria-pressed="false">COLLECTION</button>
        <button class="icon-button" id="resetButton" type="button" aria-label="レコードを最初の位置に戻す" title="リセット">↺</button>
      </div>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <div class="album-heading">
        <p class="eyebrow">NOW ON THE TURNTABLE</p>
        <p class="album-index"><span id="albumNumber">01</span> / 04</p>
        <h1 id="pageTitle"><span id="albumArtist">P4D</span><em id="albumTitle">Dance!</em></h1>
      </div>
      <div class="now-playing" aria-live="polite">
        <span class="status-dot"></span>
        <span id="playState">READY TO SPIN</span>
      </div>
    </section>

    <section class="player" aria-label="レコードプレーヤー">
      <div class="player-stage">
        <div class="record-shadow" aria-hidden="true"></div>
        <div class="record" id="record" role="slider" tabindex="0" aria-label="レコードを回す" aria-valuemin="0"
          aria-valuemax="360" aria-valuenow="0">
          <div class="grooves grooves-one"></div>
          <div class="grooves grooves-two"></div>
          <div class="label">
            <span class="label-small">GROOVE</span>
            <strong>001</strong>
            <span class="label-small">STEREO</span>
          </div>
          <div class="spindle"></div>
        </div>
        <div class="drag-hint" id="dragHint"><span>↻</span> DRAG THE VINYL</div>
        <p class="deck-caption">SIDE A <span>/</span> <strong class="session-label">001</strong></p>
      </div>
      <div class="player-footer">
        <div class="audio-time-readout"><span>TIME</span><strong id="audioTime">00:00 / 00:00</strong></div>
        <div class="speed-readout"><span>PLAYBACK</span><strong id="playbackRateValue">1.00x</strong></div>
        <div class="meter" aria-label="回転速度"><span id="meterFill"></span></div>
        <p class="angle-readout"><span>ROTATION</span><strong id="angleValue">000°</strong></p>
      </div>
    </section>

    <section class="picker-panel" id="pickerPanel" aria-label="レコードを変更" hidden>
      <div class="picker-heading">
        <div>
          <p class="eyebrow">THE VINYL ARCHIVE</p>
          <h2>Choose<br />your record.</h2>
        </div>
        <button class="close-button" id="closePickerButton" type="button">BACK TO PLAYER</button>
      </div>
      <div class="picker-window">
        <div class="picker-track" id="pickerTrack"></div>
      </div>
      <div class="picker-footer">
        <p><span id="pickerPosition">01</span> / 04</p>
        <p id="pickerStatus">中央のレコードをクリックして選択</p>
        <p class="picker-instruction">DRAG TO BROWSE →</p>
      </div>
    </section>

  </main>
  <script src="js/record-player.js?260920_4"></script>
  <script src="js/record-picker.js?260920_4"></script>
</body>

</html>
